services:
  - type: web
    name: campus-skillswap
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn skillswap.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: campus-skillswap-db
          property: connectionString

databases:
  - name: campus-skillswap-db
    databaseName: skillswap
    user: skillswap
