{% extends 'base.html' %}
{% block title %}Log In — Campus SkillSwap{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-4 col-md-6">

    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 rounded-circle p-3 mb-3">
        <i class="bi bi-arrow-left-right fs-3 text-primary"></i>
      </div>
      <h2 class="fw-bold">Welcome Back</h2>
      <p class="text-muted">Log in to manage your skill posts.</p>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <form method="post" novalidate>
          {% csrf_token %}
          {% if form.errors %}
            <div class="alert alert-danger small">Invalid username or password.</div>
          {% endif %}
          <div class="mb-3">
            <label for="id_username" class="form-label fw-semibold">Username</label>
            <input type="text" name="username" id="id_username" class="form-control" autofocus required>
          </div>
          <div class="mb-3">
            <label for="id_password" class="form-label fw-semibold">Password</label>
            <input type="password" name="password" id="id_password" class="form-control" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-brand w-100 fw-semibold">Log In</button>
        </form>
      </div>
    </div>

    <p class="text-center mt-3 text-muted small">
      Don't have an account? <a href="{% url 'register' %}">Sign up free</a>
    </p>

  </div>
</div>
{% endblock %}
