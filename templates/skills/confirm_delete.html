{% extends 'base.html' %}
{% block title %}Delete Post — Campus SkillSwap{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5 text-center">
    <div class="card border-0 shadow-sm p-4">
      <i class="bi bi-exclamation-triangle display-4 text-danger mb-3"></i>
      <h4 class="fw-bold">Delete this post?</h4>
      <p class="text-muted">"<strong>{{ post.title }}</strong>" will be permanently removed.</p>
      <form method="post" class="d-flex gap-2 justify-content-center mt-3">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary px-4">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
